name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libvte-2.91-gtk4-dev libssl-dev pkg-config xvfb
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: GTK focus regression (fatal warnings)
        env:
          G_DEBUG: fatal-warnings
          GDK_BACKEND: x11
        run: >-
          xvfb-run -a cargo test --locked --bin rustremote --
          --ignored disabling_input_delivers_focus_out_and_preserves_other_input

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Homebrew packages
        run: brew install rust pkgconf gtk4 vte3 openssl@4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows-probe:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Probe tests and ConPTY self-test
        run: |
          cargo test --locked --manifest-path experiments/windows-probe/Cargo.toml
          cargo build --locked --manifest-path experiments/windows-probe/Cargo.toml
          experiments/windows-probe/target/debug/rustremote-windows-probe.exe --self-test
