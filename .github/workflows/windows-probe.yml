name: Windows feasibility probe
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native qualification target (both for final validation)
        type: choice
        default: both
        options: [both, windows-2022, windows-11-arm]
permissions:
  contents: read
concurrency:
  group: windows-feasibility-probe
  cancel-in-progress: false
jobs:
  native-windows:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.target == 'windows-2022' && '["windows-2022"]' || inputs.target == 'windows-11-arm' && '["windows-11-arm"]' || '["windows-2022","windows-11-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_BUILD_JOBS: '2'
      GSK_RENDERER: cairo
      LIBSSH2_SYS_USE_PKG_CONFIG: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Prepare pinned official OpenSSH client for loopback qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-probe | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'rustremote-openssh.zip'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/Win32-OpenSSH/releases/download/10.4.0.0p1-Preview/OpenSSH-Win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b67ff8becd203502190ec42ac7787c24c2cd3325ed7700485fe7a1c83d2a7957') { throw 'OpenSSH SHA256 mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'rustremote-openssh-runtime'
          Expand-Archive -Path $archive -DestinationPath $extract
          $runtime = 'experiments/windows-probe/target/debug/OpenSSH'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Copy-Item (Join-Path $extract 'OpenSSH-Win64/*') $runtime -Recurse
          'OpenSSH 10.4.0.0p1-Preview; SHA256 b67ff8becd203502190ec42ac7787c24c2cd3325ed7700485fe7a1c83d2a7957; official PowerShell/Win32-OpenSSH; CI only, no binary redistribution' | Set-Content dist/windows-probe/openssh-source.txt
      - name: OpenSSH native startup environment preflight
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-probe | Out-Null
          "RUSTREMOTE_LAB_PWSH=$PSHOME\pwsh.exe" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          $client = [IO.Path]::GetFullPath('experiments/windows-probe/target/debug/OpenSSH/ssh.exe')
          $base = @('PATH','PATHEXT','TEMP','TMP','USERPROFILE','LOCALAPPDATA','APPDATA','COMSPEC','SYSTEMROOT','WINDIR')
          $reports = @()
          foreach ($mode in @('full','minimal','programdata','username','windows-base')) {
            $info = [Diagnostics.ProcessStartInfo]::new($client)
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $info.RedirectStandardInput = $true
            $info.ArgumentList.Add('-V')
            if ($mode -ne 'full') {
              $names = $base
              if ($mode -eq 'programdata') { $names += @('PROGRAMDATA','ALLUSERSPROFILE') }
              if ($mode -eq 'username') { $names += @('USERNAME','USERDOMAIN') }
              if ($mode -eq 'windows-base') { $names += @('PROGRAMDATA','ALLUSERSPROFILE','USERNAME','USERDOMAIN','HOMEDRIVE','HOMEPATH','OS','PROCESSOR_ARCHITECTURE') }
              $info.Environment.Clear()
              foreach ($name in $names) { $value = [Environment]::GetEnvironmentVariable($name); if ($null -ne $value) { $info.Environment[$name] = $value } }
            }
            $process = [Diagnostics.Process]::Start($info)
            $process.StandardInput.Close()
            if (-not $process.WaitForExit(5000)) { $process.Kill(); $process.WaitForExit(); throw 'OpenSSH version preflight timed out' }
            $reports += @{ mode = $mode; exit = $process.ExitCode; stdout = $process.StandardOutput.ReadToEnd(); stderr = $process.StandardError.ReadToEnd() }
            $process.Dispose()
          }
          $reports | ConvertTo-Json | Set-Content dist/windows-probe/client-startup.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-startup-${{ matrix.runner }}
          path: dist/windows-probe/client-startup.json
          retention-days: 7
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python-paramiko
            mingw-w64-ucrt-x86_64-python-sspilib
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libssh2
      - name: Native operating system and architecture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-probe | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | ConvertTo-Json | Set-Content dist/windows-probe/os.json
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() | Set-Content dist/windows-probe/native-architecture.txt
      - name: Native environment
        run: |
          mkdir -p dist/windows-probe
          { cmd.exe //c ver; rustc -Vv; cargo -V; pkg-config --modversion gtk4; pacman -Q mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-python-sspilib; } > dist/windows-probe/environment.txt
      - name: Shared models without Linux adapters
        run: |
          set -o pipefail
          cargo test --locked -p rustremote-core --no-default-features | tee dist/windows-probe/core-tests.txt
      - name: Build native Windows probe
        run: cargo build --locked --manifest-path experiments/windows-probe/Cargo.toml
      - name: ANSI screen and output validation tests
        run: |
          set -o pipefail
          cargo test --locked --manifest-path experiments/windows-probe/Cargo.toml | tee dist/windows-probe/ansi-tests.txt
      - name: Windows private profile storage and credentials
        run: |
          set -o pipefail
          experiments/windows-probe/target/debug/rustremote-windows-probe.exe --self-test-storage | tee dist/windows-probe/storage.txt
      - name: RDP private configuration qualification (no network)
        run: |
          set -o pipefail
          experiments/windows-probe/target/debug/rustremote-windows-probe.exe --self-test-rdp | tee dist/windows-probe/rdp-config.txt
      - name: Native RDP CredSSP loopback credentials (simulation, no desktop)
        run: |
          set -o pipefail
          python scripts/test-rdp-nla-local.py --fetch-deps --native experiments/windows-probe/target/debug/rustremote-windows-probe.exe | tee dist/windows-probe/rdp-nla.json
      - name: Local ConPTY input-output and resize
        run: |
          set -o pipefail
          experiments/windows-probe/target/debug/rustremote-windows-probe.exe --self-test | tee dist/windows-probe/conpty.txt
      - name: Interactive ConPTY streaming and lifecycle
        run: |
          set -o pipefail
          experiments/windows-probe/target/debug/rustremote-windows-probe.exe --self-test-live | tee dist/windows-probe/live-conpty.txt
      - name: Real loopback SSH and simulated Apple profile
        run: |
          set -o pipefail
          python scripts/test-windows-ssh-local.py --probe experiments/windows-probe/target/debug/rustremote-windows-probe.exe | tee dist/windows-probe/ssh-loopback.json
      - name: Real loopback SFTP transfer and editing
        run: |
          set -o pipefail
          python scripts/test-windows-ssh-local.py --probe experiments/windows-probe/target/debug/rustremote-windows-probe.exe --sftp | tee dist/windows-probe/sftp-loopback.json
      - name: Native SFTP browser widgets and real loopback transfers
        run: |
          set -o pipefail
          G_DEBUG=fatal-warnings python scripts/test-windows-ssh-local.py --probe experiments/windows-probe/target/debug/rustremote-windows-probe.exe --sftp-ui | tee dist/windows-probe/sftp-gui.json
      - name: GTK Windows startup
        run: |
          set -o pipefail
          experiments/windows-probe/target/debug/rustremote-windows-probe.exe --smoke-ui --capture-ui | tee dist/windows-probe/gui.txt
      - name: GTK interactive terminal lifecycle
        run: |
          set -o pipefail
          experiments/windows-probe/target/debug/rustremote-windows-probe.exe --smoke-live-ui --capture-ui | tee dist/windows-probe/live-gui.txt
      - name: Native profile manager and vault integration
        run: |
          set -o pipefail
          G_DEBUG=fatal-warnings experiments/windows-probe/target/debug/rustremote-windows-probe.exe --smoke-profiles-ui --capture-ui | tee dist/windows-probe/profiles-gui.txt
      - name: Prepare diagnostic artifact (not an installer)
        run: |
          cp experiments/windows-probe/README.md dist/windows-probe/README.md
          cp LICENSE NOTICE dist/windows-probe/
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-feasibility-probe-${{ matrix.runner }}
          path: dist/windows-probe/
          retention-days: 7
          if-no-files-found: error
