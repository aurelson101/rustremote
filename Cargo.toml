[package]
name = "rustremote"
version = "0.5.0"
edition = "2024"
publish = false
license-file = "LICENSE"
repository = "https://github.com/aurelson101/rustremote"
default-run = "rustremote"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
age = "0.11"
gtk = { package = "gtk4", version = "=0.10.3" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
vte = { package = "vte4", version = "=0.9.0", features = ["v0_78"] }
ssh2 = "=0.9.7"
base64 = "=0.21.7"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
zeroize = "1.8"

[profile.release]
strip = true
