[package]
name = "rustremote-windows-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

# Independent feasibility probe: the Linux application and its VTE dependencies
# are not compiled or refactored by this experiment.
[workspace]

[dependencies]
rustremote-core = { path = "../../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
zeroize = "1.8"
gtk = { package = "gtk4", version = "=0.10.3", features = ["v4_8"] }

vt100 = { version = "=0.18.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
